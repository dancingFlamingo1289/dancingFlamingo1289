       font-size: 16px;
       fill: #bb9af7; 
       font-weight: 600;
       letter-spacing: 0.5px;
       filter: drop-shadow(0 0 6px rgba(187, 154, 247, 0.4));
    }
    .vector-star {
      fill: none;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-linecap: round;
      /* Couleur unifiée : bleu de l'ASCII */
      stroke: #7aa2f7;
      /* Lueur bleue néon pour les étoiles */
      filter: drop-shadow(0 0 8px rgba(122, 162, 247, 0.7));
      animation: blink 1.5s infinite ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; transform-origin: center; }
      50% { opacity: 1; transform-origin: center; }
    }
  </style>

